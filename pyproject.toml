[project]
name = "nixi-rag"
version = "0.1.0"
description = "Clinical RAG on German gynecology guidelines: measure recall & refusal"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "openai>=1.40",
    "chromadb>=0.5",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "rank-bm25>=0.2",
    "unstructured[pdf]>=0.16",
    "httpx>=0.27",
    "ragas>=0.4.3",
    "langchain-ollama>=1.1.0",
    "datasets>=5.0.1",
    "langchain-community<0.4.2",
    "fastapi>=0.141.1",
    "uvicorn>=0.52.0",
    "jinja2>=3.1.6",
    "python-multipart>=0.0.32",
    "sentence-transformers>=5.6.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
